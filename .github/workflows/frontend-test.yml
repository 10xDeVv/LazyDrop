name: Frontend Tests & Build

on:
  workflow_dispatch:
  push:
    branches: [ main, develop ]
    paths:
      - 'apps/frontend'
      - 'apps/frontend/**'
      - '.github/workflows/frontend-test.yml'
      - '.gitmodules'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'apps/frontend'
      - 'apps/frontend/**'

jobs:
  test:
    name: Test & Lint
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'apps/frontend/package-lock.json'

      - name: Install dependencies
        working-directory: apps/frontend
        run: npm ci

      - name: Run ESLint
        working-directory: apps/frontend
        run: npm run lint
        continue-on-error: true

      - name: Run tests
        working-directory: apps/frontend
        run: npm test -- --run
        continue-on-error: true

  build:
    name: Build Next.js
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'apps/frontend/package-lock.json'

      - name: Install dependencies
        working-directory: apps/frontend
        run: npm ci

      - name: Create build .env.local
        working-directory: apps/frontend
        run: |
          cat > .env.local << EOF
          NEXT_PUBLIC_SUPABASE_URL=https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY=placeholder
          NEXT_PUBLIC_API_URL=http://localhost:8080
          EOF

      - name: Build application
        working-directory: apps/frontend
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder
          NEXT_PUBLIC_API_URL: http://localhost:8080

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: apps/frontend/.next
          retention-days: 5

  security:
    name: Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'apps/frontend/package-lock.json'

      - name: Install dependencies
        working-directory: apps/frontend
        run: npm ci

      - name: Audit dependencies
        working-directory: apps/frontend
        run: npm audit --audit-level=moderate || true
        continue-on-error: true

      - name: Check for vulnerable packages
        working-directory: apps/frontend
        run: npx snyk test --severity-threshold=high || true
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

  notify:
    name: Notification
    runs-on: ubuntu-latest
    needs: [test, build, security]
    if: always()

    steps:
      - name: Determine status
        id: status
        run: |
          if [[ "${{ needs.test.result }}" == "failure" ]]; then
            echo "status=❌ Frontend tests failed" >> $GITHUB_OUTPUT
          elif [[ "${{ needs.build.result }}" == "failure" ]]; then
            echo "status=❌ Frontend build failed" >> $GITHUB_OUTPUT
          elif [[ "${{ needs.security.result }}" == "failure" ]]; then
            echo "status=⚠️ Security checks failed" >> $GITHUB_OUTPUT
          else
            echo "status=✅ All checks passed" >> $GITHUB_OUTPUT
          fi

      - name: Comment on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '${{ steps.status.outputs.status }}'
            })
        continue-on-error: true