name: Backend Tests & Code Quality

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'apps/backend/**'
      - '.github/workflows/backend-test.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'apps/backend/**'

jobs:
  test:
    name: Test & Coverage
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: lazydrop_test
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Create test .env file
        working-directory: apps/backend
        run: |
          cat > .env << EOF
          DATABASE_URL=jdbc:postgresql://localhost:5432/lazydrop_test
          DATABASE_USERNAME=test
          DATABASE_PASSWORD=test
          SUPABASE_URL=https://test.supabase.co
          SUPABASE_ANON_KEY=test_key
          SUPABASE_JWT_SECRET=test_secret
          SUPABASE_SERVICE_KEY=test_service_key
          SUPABASE_BUCKET_NAME=test-bucket
          CORS_ALLOWED_ORIGINS=http://localhost:3000
          APP_FRONTEND_URL=http://localhost:3000
          APP_COOKIES_SECURE=false
          STRIPE_TEST_SECRET_KEY=sk_test_example
          STRIPE_WEBHOOK_SECRET=whsec_test
          EOF

      - name: Run tests with Maven
        working-directory: apps/backend
        run: mvn clean test -B -q
        env:
          DATABASE_URL: jdbc:postgresql://localhost:5432/lazydrop_test
          DATABASE_USERNAME: test
          DATABASE_PASSWORD: test
          SUPABASE_URL: https://test.supabase.co
          SUPABASE_ANON_KEY: test_key
          SUPABASE_JWT_SECRET: test_secret
          SUPABASE_SERVICE_KEY: test_service_key
          SUPABASE_BUCKET_NAME: test-bucket
          CORS_ALLOWED_ORIGINS: http://localhost:3000
          APP_FRONTEND_URL: http://localhost:3000
          STRIPE_TEST_SECRET_KEY: sk_test_example

      - name: Generate code coverage report
        working-directory: apps/backend
        run: mvn jacoco:report -B -q
        continue-on-error: true

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          files: ./apps/backend/target/site/jacoco/jacoco.xml
          flags: backend
          fail_ci_if_error: false

  build:
    name: Build JAR
    runs-on: ubuntu-latest
    needs: test
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Create build .env file
        working-directory: apps/backend
        run: |
          cat > .env << EOF
          DATABASE_URL=jdbc:postgresql://localhost:5432/lazydrop
          DATABASE_USERNAME=lazydrop
          DATABASE_PASSWORD=lazydrop
          SUPABASE_URL=https://placeholder.supabase.co
          SUPABASE_ANON_KEY=placeholder
          SUPABASE_JWT_SECRET=placeholder
          SUPABASE_SERVICE_KEY=placeholder
          SUPABASE_BUCKET_NAME=placeholder
          CORS_ALLOWED_ORIGINS=https://example.com
          APP_FRONTEND_URL=https://example.com
          APP_COOKIES_SECURE=true
          STRIPE_TEST_SECRET_KEY=sk_live_placeholder
          STRIPE_WEBHOOK_SECRET=whsec_placeholder
          EOF

      - name: Build with Maven
        working-directory: apps/backend
        run: mvn clean package -B -q -DskipTests

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v3
        with:
          name: backend-jar
          path: apps/backend/target/*.jar
          retention-days: 5

  quality:
    name: Code Quality Analysis
    runs-on: ubuntu-latest
    needs: test
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Run SonarQube analysis
        working-directory: apps/backend
        run: |
          mvn clean verify sonar:sonar \
            -Dsonar.projectKey=lazydrop-backend \
            -Dsonar.projectName="LazyDrop Backend" \
            -Dsonar.sources=src/main \
            -Dsonar.tests=src/test \
            -B -q || true
        env:
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
          SONAR_LOGIN: ${{ secrets.SONAR_LOGIN }}
        continue-on-error: true

      - name: Check for vulnerable dependencies
        working-directory: apps/backend
        run: mvn dependency-check:check -B -q || true
        continue-on-error: true

  notify:
    name: Notification
    runs-on: ubuntu-latest
    needs: [test, build, quality]
    if: always()
    
    steps:
      - name: Determine status
        id: status
        run: |
          if [[ "${{ needs.test.result }}" == "failure" ]]; then
            echo "status=❌ Backend tests failed" >> $GITHUB_OUTPUT
          elif [[ "${{ needs.build.result }}" == "failure" ]]; then
            echo "status=❌ Backend build failed" >> $GITHUB_OUTPUT
          elif [[ "${{ needs.quality.result }}" == "failure" ]]; then
            echo "status=⚠️ Code quality checks failed" >> $GITHUB_OUTPUT
          else
            echo "status=✅ All checks passed" >> $GITHUB_OUTPUT
          fi

      - name: Comment on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '${{ steps.status.outputs.status }}'
            })
        continue-on-error: true
